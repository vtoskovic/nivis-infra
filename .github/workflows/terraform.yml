name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.13.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # Static checks: no credentials involved. check.sh runs fmt, validate, module tests, tflint,
  # trivy, gitleaks and actionlint in Docker (preinstalled on GitHub runners).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Quality gate
        run: ./scripts/check.sh

  # ------------------------------------------------------------------------------------------
  # Pull requests: plan every stack with READ-ONLY credentials and post the result.
  # Dependabot PRs get no secrets, so they are skipped (checks still run).
  # ------------------------------------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: [global, test, prod]
    concurrency:
      group: tf-plan-${{ matrix.stack }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.PLAN_DIGITALOCEAN_TOKEN }}
      SPACES_ACCESS_KEY_ID: ${{ secrets.PLAN_SPACES_ACCESS_KEY_ID }}
      SPACES_SECRET_ACCESS_KEY: ${{ secrets.PLAN_SPACES_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PLAN_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PLAN_SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir=stacks/${{ matrix.stack }} init -backend-config=../../backend.hcl

      # Secret values are marked sensitive and render as (sensitive value). No plan file is
      # uploaded as an artifact: binary plans contain secrets in clear text.
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=stacks/${{ matrix.stack }} plan -lock=false -no-color -detailed-exitcode \
            | tee plan.txt || code=$?
          echo "exitcode=${code:-0}" >> "$GITHUB_OUTPUT"
          [ "${code:-0}" -ne 1 ]

      - name: Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan.txt', 'utf8');
            const summary = body.split('\n').filter(l => /^(Plan:|No changes)/.test(l)).join('\n') || 'see run log';
            const trimmed = body.length > 60000 ? body.slice(-60000) : body;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### terraform plan – \`${process.env.STACK}\`\n**${summary}**\n<details><summary>Show plan</summary>\n\n\`\`\`\n${trimmed}\n\`\`\`\n</details>`,
            });

  # ------------------------------------------------------------------------------------------
  # main: global -> test. Prod is applied only by terraform-prod.yml (manual dispatch).
  # ------------------------------------------------------------------------------------------
  apply-global:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    uses: ./.github/workflows/_apply.yml
    with:
      stack: global
    secrets: inherit

  apply-test:
    needs: apply-global
    uses: ./.github/workflows/_apply.yml
    with:
      stack: test
    secrets: inherit
