# Copy to nivis/.github/workflows/deploy.yml.
#
# Terraform owns the infrastructure and the app spec; this workflow only ships code:
#   main  -> build backend image once, tag :<sha> and :test, deploy test
#   v*.*.* tag -> (approval) re-tag the SAME image :prod, move `release` to the tag, deploy prod
#
# GitHub Environments "test" and "prod" (prod with required reviewers) each hold:
#   secret   DIGITALOCEAN_DEPLOY_TOKEN  custom-scoped token: registry read/write + app read/update only
#   variable APP_ID                     `terraform output app_id` of that stack
name: deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: registry.digitalocean.com/nivis
  IMAGE: backend

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_DEPLOY_TOKEN }}
      - run: doctl registry login --expiry-seconds 900
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    needs: build
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_DEPLOY_TOKEN }}
      # Rebuilds the static site from main and rolls api/worker to :test after the migrate job.
      - run: doctl apps create-deployment "${{ vars.APP_ID }}" --wait

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write # move the release branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_DEPLOY_TOKEN }}
      - run: doctl registry login --expiry-seconds 900
      - uses: docker/setup-buildx-action@v3
      # Promote the image that was tested – no rebuild for prod.
      - name: Promote image
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE:prod" \
            --tag "$REGISTRY/$IMAGE:${GITHUB_REF_NAME}" \
            "$REGISTRY/$IMAGE:${GITHUB_SHA}"
      - name: Point release branch at the tag (static site source)
        run: git push --force origin "${GITHUB_SHA}:refs/heads/release"
      - run: doctl apps create-deployment "${{ vars.APP_ID }}" --wait
